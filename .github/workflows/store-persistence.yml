name: Native iPad persistence
on:
  push:
    branches: [qa/native-persistence-279]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-store-images
          run-id: 46097636257
          github-token: ${{ github.token }}
          path: /tmp/store-assets
      - name: Exercise the corrected store candidate
        run: |
          command -v xcodegen || brew install xcodegen
          ditto -xk /tmp/store-assets/done-simulator.zip /tmp/store-app
          bash qa/capture/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-evidence
          path: qa/output
          retention-days: 5
