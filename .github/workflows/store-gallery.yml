name: Store gallery photography
on:
  push:
    branches: [qa/store-gallery-20261128]
permissions:
  contents: read
  actions: read
jobs:
  ipad:
    name: Capture 13-inch iPad
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simulator-application-298
          run-id: 46099340426
          github-token: ${{ github.token }}
          path: /tmp/done-qa
      - name: Boot device
        timeout-minutes: 7
        run: |
          ditto -xk /tmp/done-qa/done-simulator.zip /tmp/done-qa
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, group in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in group if d["isAvailable"] and "iPad Pro 13-inch (M5)" in d["name"]))')
          echo "QA_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Install the app and write synthetic sample data
        timeout-minutes: 5
        run: |
          xcrun simctl status_bar "$QA_DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl ui "$QA_DEVICE" appearance light
          xcrun simctl install "$QA_DEVICE" /tmp/done-qa/done.app
          xcrun simctl launch "$QA_DEVICE" app.thedone.ios
          container=$(xcrun simctl get_app_container "$QA_DEVICE" app.thedone.ios data)
          db="$container/Library/Application Support/done/done.db"
          echo "QA_DB=$db" >> "$GITHUB_ENV"
          for ((attempt = 0; attempt < 50; attempt++)); do test -f "$db" && break; sleep 1; done
          test -f "$db"
          xcrun simctl terminate "$QA_DEVICE" app.thedone.ios
          sqlite3 "$db" < qa/store-gallery/sample.sql
          xcrun simctl launch "$QA_DEVICE" app.thedone.ios
      - name: Capture Today after startup
        run: |
          mkdir -p qa/output
          command -v xcodegen || brew install xcodegen
          (cd qa/store-gallery/automation && xcodegen generate)
          sleep 15
          xcrun simctl io "$QA_DEVICE" screenshot qa/output/Today.png
      - uses: actions/upload-artifact@v4
        with:
          name: iPad-Today
          path: qa/output/Today.png
          retention-days: 3
      - name: Capture and verify Board, Focus, Notes, and Upcoming
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcodebuild -project qa/store-gallery/automation/StoreQA.xcodeproj -scheme StoreQA -destination "id=$QA_DEVICE" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/screens.xcresult" -only-testing:Capture/Capture test | tee "$RUNNER_TEMP/screens.log"
      - name: Export results
        if: always()
        run: |
          mkdir -p qa/output
          if test -f "$RUNNER_TEMP/screens.log"; then cp "$RUNNER_TEMP/screens.log" qa/output; fi
          if test -n "${QA_DB:-}" && test -f "$QA_DB"; then sqlite3 "$QA_DB" 'select title from task; select text from note' > qa/output/store-records.txt; fi
          if test -d "$RUNNER_TEMP/screens.xcresult"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/screens.xcresult" --output-path qa/output/screens
          fi
      - name: Verify and name native 2064 by 2752 PNGs
        run: python3 qa/store-gallery/verify-ipad.py qa/output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPad-verification
          path: qa/output
          retention-days: 3
