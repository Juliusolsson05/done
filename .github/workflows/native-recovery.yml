name: Store native iPad verification
on:
  push:
    branches: [qa/native-final-input-298]
permissions:
  contents: read
  actions: read
jobs:
  devices:
    strategy:
      fail-fast: false
      matrix: {family: [iPad]}
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simulator-application-298
          run-id: 46099340426
          github-token: ${{ github.token }}
          path: /tmp/done-qa
      - name: Boot device
        timeout-minutes: 7
        run: |
          ditto -xk /tmp/done-qa/done-simulator.zip /tmp/done-qa
          family=${{ matrix.family }}
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; f=sys.argv[1]; ds=[d for k,ds in sorted(json.load(sys.stdin)["devices"].items(),reverse=True) if "iOS" in k for d in ds if d["isAvailable"] and (("Pro Max" in d["name"]) if f=="iPhone" else ("iPad Pro 13-inch" in d["name"]))]; print(ds[0]["udid"])' "$family")
          echo "QA_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Install the app and write synthetic sample data
        timeout-minutes: 5
        run: |
          xcrun simctl status_bar "$QA_DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl ui "$QA_DEVICE" appearance light
          xcrun simctl install "$QA_DEVICE" /tmp/done-qa/done.app
          xcrun simctl launch "$QA_DEVICE" app.thedone.ios
          container=$(xcrun simctl get_app_container "$QA_DEVICE" app.thedone.ios data)
          db="$container/Library/Application Support/done/done.db"
          echo "QA_DB=$db" >> "$GITHUB_ENV"
          for i in {1..50}; do test -f "$db" && break; sleep 1; done
          test -f "$db"
          xcrun simctl terminate "$QA_DEVICE" app.thedone.ios
          sqlite3 "$db" < qa/capture/sample.sql
          xcrun simctl launch "$QA_DEVICE" app.thedone.ios
      - name: Capture Today after startup
        run: |
          mkdir -p qa/output
          command -v xcodegen || brew install xcodegen
          (cd qa/capture/automation && xcodegen generate)
          sleep 15
          xcrun simctl io "$QA_DEVICE" screenshot qa/output/Today.png
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.family }}-Today
          path: qa/output/Today.png
          retention-days: 3
      - name: Verify native SQLite task and note across a relaunch
        if: success()
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcodebuild -project qa/capture/automation/StoreQA.xcodeproj -scheme StoreQA -destination "id=$QA_DEVICE" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/save.xcresult" -only-testing:Capture/Capture/testWriteAndReopen test | tee "$RUNNER_TEMP/save.log"
      - name: Export results
        if: always()
        run: |
          mkdir -p qa/output
          for suite in screens save; do
            if test -d "$RUNNER_TEMP/$suite.xcresult"; then xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$suite.xcresult" --output-path "qa/output/$suite" || true; fi
            if test -f "$RUNNER_TEMP/$suite.log"; then cp "$RUNNER_TEMP/$suite.log" qa/output; fi
          done
          if test -f "$QA_DB"; then sqlite3 "$QA_DB" 'select title from task; select text from note' > qa/output/store-records.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.family }}-verification
          path: qa/output
          retention-days: 3
