[package]
name = "done-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "done-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
done-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
