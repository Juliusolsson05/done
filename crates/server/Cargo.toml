[package]
name = "done-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "done-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
base64 = "0.23.1"
done-core = { path = "../core" }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
