[package]
name = "done-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "done-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
base64 = "0.23.1"
cookie = { version = "0.18", features = ["signed"] }
deadpool-postgres = "0.14.2"
done-core = { path = "../core" }
futures-util = "0.3.34"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-postgres = "0.7.18"
tower-http = { version = "0.7.1", features = ["cors"] }
yrs = { version = "0.28.2", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
