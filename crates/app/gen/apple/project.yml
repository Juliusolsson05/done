name: done-app
options:
  bundleIdPrefix: dev.done.app
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: done
      PRODUCT_BUNDLE_IDENTIFIER: dev.done.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  done-app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The Live Activity's attributes and the widgets' data paths, compiled
      # into this target and the widget extension alike: ActivityKit matches
      # an activity to its view by this exact type (Shared/DoneShared.swift).
      - path: Shared
      - path: Assets.xcassets
      # Exclude built static libs: regenerating with xcodegen after a build
      # otherwise turns the per-configuration libapp.a copies into colliding
      # resources ("Multiple commands produce …/libapp.a"). They are linked
      # via LIBRARY_SEARCH_PATHS, never bundled as resources.
      - path: Externals
        excludes: ["**/*.a"]
      - path: done-app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: done-app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # The focus countdown in the Dynamic Island and on the Lock Screen.
        NSSupportsLiveActivities: true
        # done:// links: how the browser hands a finished sign-in back to the
        # app (crates/app/src/lib.rs, the deep-link plugin). Tauri wrote this
        # into Info.plist once, at `tauri ios init`; Info.plist is generated
        # from this file, so it must be here or the next regeneration drops it
        # and sign-in stops returning to the app.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).done
            CFBundleURLSchemes: [done]
    entitlements:
      path: done-app_iOS/done-app_iOS.entitlements
      # The app writes the widgets' data where the extension can read it.
      properties:
        com.apple.security.application-groups: [group.dev.done.app]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        # Sources/done-app/DoneNative.swift: the Dynamic Island and widget bridge.
        SWIFT_VERSION: "5.0"
        # Tauri's "Build Rust Code" step (preBuildScripts below) writes this
        # target's entitlements file during the build, keeping what is in it;
        # Xcode stops a build whose entitlements file changes after it was
        # read. The content is the same, so the signature is right.
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: done-widgets
        embed: true
        codeSign: true
      - framework: libapp.a
        embed: false
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
        weak: true
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          npx --yes @tauri-apps/cli@2 ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  # Today on the Home and Lock Screen, and the focus countdown in the Dynamic
  # Island. Declared here, not added in Xcode: the project is generated from
  # this file, so a target added by hand disappears at the next
  # `xcodegen generate`. iOS 16.1 is the first with Live Activities.
  done-widgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Widgets
      - path: Shared
    info:
      # XcodeGen 2.45 needs a path for an extension with `info` properties, or
      # the extension builds but never loads.
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: done
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/done-widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.done.app]
    settings:
      base:
        PRODUCT_NAME: done-widgets
        PRODUCT_BUNDLE_IDENTIFIER: dev.done.app.widgets
        SWIFT_VERSION: "5.0"
        ARCHS: [arm64]
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
