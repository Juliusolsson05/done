[package]
name = "done-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "done"
path = "src/main.rs"

# An iPhone app is built from a library, not a program, so the app lives in
# one and the Mac program above starts it.
[lib]
name = "done_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
done-core = { path = "../core" }
done-mcp = { version = "0.1.0", path = "../mcp" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-opener = "2.7.3"

# Updating itself is something only the Mac app does; on a phone the store does it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"

# The taps under your finger (ui/src/lib/haptics.ts). Phones only: a Mac has
# no Taptic Engine for an app to use.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2.4.2"

# One setting on the iPhone and iPad web view (`keep_clear_of_the_notch` in
# lib.rs). Already in the build through Tauri; named here to call it directly.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
